name: Build iOS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Sync Capacitor
        run: |
          npx cap sync ios
          ls ios/App/*.xcodeproj
      - name: Build iOS
        run: |
          cd ios/App
          WORKDIR=$(pwd)
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          fi
          find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d -newer "$WORKDIR/App.xcodeproj" 2>/dev/null | head -1
      - name: Create IPA
        run: |
          cd ios/App
          WORKDIR=$(pwd)
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d 2>/dev/null | sort -r | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p "$WORKDIR/build/Payload"
          cp -r "$APP_PATH" "$WORKDIR/build/Payload/"
          cd "$WORKDIR/build"
          zip -r App.ipa Payload
          ls -la "$WORKDIR/build/App.ipa"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: translate-now-ipa
          path: ios/App/build/App.ipa
          retention-days: 7
