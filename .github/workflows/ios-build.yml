name: Build iOS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Sync Capacitor
        run: |
          npx cap sync ios
          ls ios/App/*.xcodeproj
      - name: Build iOS
        run: |
          cd ios/App
          WORKDIR=$(pwd)
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$WORKDIR/App.xcarchive" build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>method</key><string>ad-hoc</string></dict></plist>' > export.plist
          xcodebuild -exportArchive -archivePath "$WORKDIR/App.xcarchive" -exportPath "$WORKDIR/build" -exportOptionsPlist export.plist CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          ls -la build/
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: translate-now-ipa
          path: ios/App/build/App.ipa
          retention-days: 7
