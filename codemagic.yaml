# Codemagic CI/CD for translate-now-app
workflows:
  ios-workflow:
    name: iOS
    max_build_duration: 60
    environment:
      vars:
        XCODE_VERSION: "15.0"
        APP_NAME: "translate-now-app"
    triggering:
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - git clone https://github.com/mattypatty918-wq/translate-now-app.git --depth 1
      - cd translate-now-app && git submodule update --init --recursive
      - cd translate-now-app && xcode-project fetch-dependencies --use-cache
      - cd translate-now-app && xcode-project build --workspace ios/App.xcworkspace --scheme App --configuration Release
    artifacts:
      - translate-now-app/ios/App/App.xcarchive
    publishing:
      app_store_connect:
        api_key: Whitefoxes
